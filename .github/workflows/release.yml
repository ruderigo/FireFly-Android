name: Build & Release APK

# Push a tag like v0.4.0 (matching versionName in app/build.gradle.kts) to build the
# release APK, signed with your key, and publish it as a GitHub Release.
# "Run workflow" by hand builds the same APK as a downloadable artifact, no release.
# Secrets: FIREFLY_KEYSTORE_BASE64, FIREFLY_KEYSTORE_PASSWORD, FIREFLY_KEY_ALIAS,
# FIREFLY_KEY_PASSWORD (see docs/RELEASE.md).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.13 (Chaquopy builds with it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName $VERSION, tag $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG doesn't match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FIREFLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FIREFLY_KEYSTORE_BASE64 is missing: see docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/firefly-release.jks"
          echo "FIREFLY_KEYSTORE=$RUNNER_TEMP/firefly-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          FIREFLY_KEYSTORE_PASSWORD: ${{ secrets.FIREFLY_KEYSTORE_PASSWORD }}
          FIREFLY_KEY_ALIAS: ${{ secrets.FIREFLY_KEY_ALIAS }}
          FIREFLY_KEY_PASSWORD: ${{ secrets.FIREFLY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check it's signed, and name it as a Stump node expects
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK (only an unsigned one?): check the signing secrets"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          OUT="FireFly-Android-$VERSION.apk"
          cp "$APK" "$OUT"
          rm -f "$RUNNER_TEMP/firefly-release.jks"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
cat >> docs/RELEASE.md <<'EOF'

## Releases built by GitHub

`.github/workflows/release.yml` builds the same signed APK on GitHub when you
push a version tag, and publishes it as a GitHub Release named
`FireFly-Android-<version>.apk` (the name a Stump node looks for in its
`tools/` folder). Give GitHub your key once, as repository secrets:

    base64 -i ~/firefly-release.jks | gh secret set FIREFLY_KEYSTORE_BASE64
    gh secret set FIREFLY_KEYSTORE_PASSWORD
    gh secret set FIREFLY_KEY_ALIAS --body firefly
    gh secret set FIREFLY_KEY_PASSWORD

For each release, bump versionName and versionCode in app/build.gradle.kts,
commit, then `git tag v<version>` and `git push origin v<version>`.
The tag must match versionName, or the build stops before doing anything.
