name: Screenshots

# The README's screenshots: the debug APK in an Android emulator, seeded with a demo
# (tools/screenshots/seed.py: made-up friends and a neighbourhood Stump), a few screens
# saved as PNGs. Run by hand (Actions > Screenshots > Run workflow); the PNGs (and each
# screen's view tree) land on the "screenshots" branch, and in the run's artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build the debug APK (x86_64 for the emulator)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pfirefly.abis=x86_64

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screens in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/screenshots/capture.py app/build/outputs/apk/debug/app-debug.apk shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

      - name: Put them on the screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          rm -rf shots/_seed
          git checkout --orphan screenshots
          git rm -rq --cached .
          git add -f shots
          git commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -f origin screenshots
