name: Tests

# Every push to main and every pull request: the Python engine tests (engine-tests/),
# then a debug APK build so a change that breaks Kotlin, CMake or Chaquopy is caught
# before a release tag. Releases are still built by release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      # Same Python as Chaquopy embeds in the app (chaquopy.defaultConfig.version).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Same pins as the APK (chaquopy pip block in app/build.gradle.kts).
      - name: Install the engine's dependencies
        run: pip install rns==1.5.5 lxmf==1.2.0 pyserial

      - name: Final message states can't be overwritten
        timeout-minutes: 2
        run: bash engine-tests/ci_run.sh run_outbound_race.py

      - name: Stamps (LXMF proof-of-work, Android path)
        timeout-minutes: 2
        run: bash engine-tests/ci_run.sh run_stamps.py

      - name: Billboard and file shelf over Wi-Fi
        timeout-minutes: 2
        run: bash engine-tests/ci_run.sh run_web.py

      - name: Stump chat over mesh and Wi-Fi
        timeout-minutes: 4
        run: bash engine-tests/ci_run.sh run_stump.py

      - name: Stump chat with a node from before Stump 1.0.0-beta.4
        timeout-minutes: 4
        env:
          FAKE_STUMP_OLD: "1"
        run: bash engine-tests/ci_run.sh run_stump.py

      - name: The greeting (/hello), and /auth + /nick on older Stumps
        timeout-minutes: 3
        run: bash engine-tests/ci_run.sh run_hello.py run_greeting.py run_auto_auth.py

      - name: Hybrid access, private messages over LoRa and Wi-Fi, a steady list
        timeout-minutes: 3
        run: bash engine-tests/ci_run.sh run_hybrid.py run_dm_sides.py run_order.py

      - name: A Stump that moved, a phone with no radio, home Wi-Fi
        timeout-minutes: 4
        run: bash engine-tests/ci_run.sh run_relocate.py run_reach.py run_gateway.py

      - name: Stump node without Opus
        timeout-minutes: 2
        run: bash engine-tests/ci_run.sh run_stump_legacy.py

      - name: Radio against simulated USB and BLE RNodes
        timeout-minutes: 3
        run: bash engine-tests/ci_run.sh run_radio.py

      - name: AutoInterface without if_nametoindex
        timeout-minutes: 2
        run: bash engine-tests/ci_run.sh run_autointerface.py

      - name: Two engines over a simulated LoRa channel
        timeout-minutes: 6
        run: bash engine-tests/ci_run.sh run_air.py

      # Usually ~2.5 min, but its cost-16 stamps are proof-of-work on one core
      # (no multiprocessing, as on Android), so a slow runner can take far longer;
      # the test's own waits allow up to ~17 min before it fails on its own.
      - name: Messages left at a propagation node
        timeout-minutes: 18
        run: bash engine-tests/ci_run.sh run_propagation.py

  build:
    name: Debug APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.13 (Chaquopy builds with it)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
